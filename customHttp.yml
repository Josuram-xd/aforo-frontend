# Security headers for AWS Amplify Hosting (applied to every response).
# The CSP only allows our own bundle plus the Supabase project (REST, Auth, Realtime websocket,
# Edge Functions) and Google profile pictures. Google sign-in is a top-level redirect handled by
# Supabase Auth, so it needs no extra CSP entry. If the Supabase project changes, update
# connect-src here and in vite.config.ts (preview headers).
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://uezrriyikquncmcgwwzo.supabase.co wss://uezrriyikquncmcgwwzo.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Frame-Options
        value: DENY
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - key: Cross-Origin-Opener-Policy
        value: same-origin
  - pattern: '/assets/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
